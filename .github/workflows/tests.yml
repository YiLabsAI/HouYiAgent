name: Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read
  id-token: write

jobs:
  test:
    runs-on: ${{ matrix.os }}
    env:
      PYTHONUTF8: "1"  # PEP 686 — default UTF-8 for Windows (native from Python 3.15)
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ['3.11', '3.12', '3.13']

    steps:
    - uses: actions/checkout@v6

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v6
      with:
        python-version: ${{ matrix.python-version }}

    - name: Set up uv
      uses: astral-sh/setup-uv@v7

    - name: Install dependencies
      env:
        UV_INDEX_URL: https://pypi.org/simple
        UV_EXTRA_INDEX_URL: ""
      run: |
        uv sync --extra dev --extra rag

    - name: Run tests with coverage
      run: |
        uv run pytest tests/ --ignore=tests/integration -v --cov=houyi --cov-report=xml --cov-report=term

    - name: Upload coverage to Codecov
      if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.11'
      uses: codecov/codecov-action@v6
      with:
        slug: YiLabsAI/HouYiAgent
        files: ./coverage.xml
        flags: unittests
        name: codecov-umbrella
        use_oidc: true
        verbose: true
        fail_ci_if_error: true

  server-test:
    runs-on: ubuntu-latest
    env:
      PYTHONUTF8: "1"

    steps:
    - uses: actions/checkout@v6

    - name: Set up Python 3.11
      uses: actions/setup-python@v6
      with:
        python-version: '3.11'

    - name: Set up uv
      uses: astral-sh/setup-uv@v7

    - name: Install dependencies
      env:
        UV_INDEX_URL: https://pypi.org/simple
        UV_EXTRA_INDEX_URL: ""
      run: |
        uv sync --extra dev --extra rag
        uv pip install -e houyi-studio/server --quiet

    - name: Run server tests
      run: |
        uv run pytest houyi-studio/server/tests/ -v --tb=short
