name: Lint

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Set up uv
      uses: astral-sh/setup-uv@v3

    - name: Install dependencies
      env:
        UV_INDEX_URL: https://pypi.org/simple
        UV_EXTRA_INDEX_URL: ""
      run: |
        uv sync --extra dev

    - name: Run ruff
      run: |
        uv run ruff check houyi/ tests/ --exclude skills/
