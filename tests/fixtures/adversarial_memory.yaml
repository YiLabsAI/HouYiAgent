# Adversarial memory fixture — S2.3-T16
#
# Each entry exercises a known recall / answer-side hazard. The
# memory bench harness (S2.4-T7+) loads this file and asserts that
# the system either produces the expected answer or abstains with
# the expected reason. New cases SHOULD pick a documented kind from
# the schema below; new kinds SHOULD update the loader's enum.
#
# Schema:
#   id              — short kebab-case id, unique
#   kind            — one of:
#                       negation_check, retracted_fact, temporal_conflict,
#                       vague_certainty, relational_multi_hop,
#                       empty_memory, false_premise, implicit_expectation,
#                       contradiction, ambiguous_subject, paraphrase_recall,
#                       sourceless_drop
#   query           — the user's question
#   seed_facts      — list of {subject, predicate, object, certainty,
#                              valid_from?, valid_to?, source_anchor}
#                     facts pre-seeded into entity_state before recall
#   expected:
#     mode          — one of: answer | abstain
#     reason        — when mode=abstain: matches LLMAnswerer.reason
#                     (no_candidates / low_evidence / explicit_absence /
#                      contradicting_evidence / llm_idk / too_few_facts /
#                      low_top_score / timeout / llm_failed) or
#                     "any_abstain" if any of the above is acceptable
#     contains      — when mode=answer: substring(s) the answer must
#                     contain (case-insensitive)
#     forbid        — substring(s) the answer must NOT contain

cases:

  # ---------------------------------------------------------------------
  # Negation checks (yes/no over presence) — 8 cases
  # ---------------------------------------------------------------------

  - id: neg-001
    kind: negation_check
    query: "Did I ever tell you my favorite color?"
    seed_facts: []
    expected:
      mode: abstain
      reason: explicit_absence

  - id: neg-002
