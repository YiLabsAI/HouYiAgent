[project]
name = "houyi"
version = "0.1.1"
description = "Next-generation lightweight multi-agent framework with industry-leading capabilities"
authors = [
    {name = "HouYi Team"}
]
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
keywords = ["agent", "multi-agent", "llm", "neuro-symbolic", "orchestration"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",

]

dependencies = [
    "pydantic>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.1.0",
    "pytest-xdist>=3.0",
    "import-linter>=2.0",
    "pre-commit>=3.0.0",
    "ruff>=0.1.0",
    "mypy>=1.5.0",
    "httpx>=0.25.0",
    "python-dotenv>=1.0.0",
    "websockets>=12.0",
    "fastapi>=0.104.0",
    "z3-solver>=4.12.0",
    "sqlparse>=0.4.0",
]

studio-server = [
    "fastapi>=0.104.0",
    "uvicorn[standard]>=0.24.0",
    "websockets>=12.0",
    "python-multipart>=0.0.6",
    "aiofiles>=23.2.1",
]

websearch-ddg = [
    "ddgs>=9.0,<10",
]

websearch-tavily = [
    "tavily-python>=0.3.0",
]

websearch-readability = [
    "readability-lxml>=0.8.1",
    "beautifulsoup4>=4.11.0",
    "markdownify>=0.14.0",
]

distributed = [
    "celery>=5.3.0",
    "redis>=5.0.0",
]

model-adapters = [
    "openai>=1.0.0",
    "anthropic>=0.7.0",
]

skill-yaml = [
    "pyyaml>=6.0.3",
]

vertex-ai = [
    "google-genai>=1.0.0",
    "google-auth>=2.48.0",
]

verification = [
    "z3-solver>=4.12.0",
    "sqlparse>=0.4.0",
]

observability = [
    "opentelemetry-api>=1.20.0",
    "opentelemetry-sdk>=1.20.0",
]

rag = [
    "numpy>=1.24.0",
    "hnswlib>=0.8.0",
    "bm25s>=0.2.0",
]

rag-embedding = [
    "fastembed>=0.3.0",
]

rag-pdf = [
    "pypdf>=6.7.4",
    "pdfplumber>=0.10.0",
]

rag-excel = [
    "openpyxl>=3.1.0",
    "pandas>=2.0.0",
    "xlrd>=2.0.1",
]

rag-office = [
    "python-docx>=1.1.0",
    "python-pptx>=0.6.23",
]

rag-epub = [
    "EbookLib>=0.18",
    "beautifulsoup4>=4.11.0",
]

rag-full = [
    "houyi[rag,rag-embedding,rag-pdf,rag-excel,rag-office,rag-epub]",
]

all = [
    "houyi[dev,studio-server,distributed,model-adapters,vertex-ai,verification,observability,rag-full,websearch-ddg,websearch-tavily,websearch-readability,skill-yaml]",
]

[build-system]
requires = ["setuptools>=68.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["houyi*"]
exclude = [
    "houyi.studio.server",
    "houyi.studio.server.*",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "UP",   # pyupgrade
    "SIM",  # flake8-simplify
    "RUF",  # ruff-specific rules
    "T20",  # flake8-print (SDK should use logging)
]
ignore = [
    "E501",   # line too long (handled by formatter)
    "SIM108", # ternary operator — sometimes if/else is clearer
    "RUF001", # ambiguous-unicode-character-string — false positives on CJK
    "RUF002", # ambiguous-unicode-character-docstring — false positives on CJK
    "RUF003", # ambiguous-unicode-character-comment — false positives on CJK
    "RUF012", # mutable class variable — too noisy with Pydantic models
]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.pylint]
max-branches = 12
max-statements = 50

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = [
    "F811",   # redefinition of unused name (common in test fixtures)
    "F841",   # local variable assigned but never used (test setup)
    "B011",   # assert False usage (valid in tests)
    "B905",   # zip without explicit strict parameter
    "T20",    # print allowed in tests
    "SIM115", # open() without context manager (test fixtures)
    "SIM117", # multiple-with-statements (nested mocking)
    "RUF006", # asyncio-dangling-task (fire-and-forget in tests)
    "RUF059", # unused unpacked variable (common in test assertions)
]
"houyi-studio/server/tests/**/*.py" = [
    "F811", "F841", "B011", "B905", "T20",
    "SIM115", "SIM117", "RUF006", "RUF059",
]
"scripts/**/*.py" = [
    "T20",   # print allowed in scripts
]
"examples/**/*.py" = [
    "E402",  # module level import not at top (examples show step-by-step)
    "T20",
]
"houyi/skills/**/*.py" = ["E402"]  # conditional late imports in skill modules

[tool.mypy]
python_version = "3.11"
strict = false
warn_return_any = false
warn_unused_configs = true
warn_unused_ignores = true
ignore_missing_imports = true
disable_error_code = [
    "call-arg",             # 14 errors — Pydantic dataclass defaults (needs mypy-pydantic plugin)
    "var-annotated",        #  2 errors — runtime/team.py untyped locals
    "valid-type",           #  6 errors — method name shadows builtin / callable as type
    "annotation-unchecked",
]

[[tool.mypy.overrides]]
module = ["houyi.core.*", "houyi.protocol.*"]
disallow_untyped_defs = true
warn_return_any = true

[[tool.mypy.overrides]]
module = ["houyi_studio.server.chat.chat_service"]
disallow_untyped_defs = true
warn_return_any = true

[[tool.mypy.overrides]]
module = [
    "houyi.verification.*",
    "houyi.rag.*",
    "houyi.evaluation.*",
]
ignore_errors = true


[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-v --tb=short"
python_classes = ["Test*", "!TestCase"]
filterwarnings = [
    "ignore::pytest.PytestCollectionWarning",
]
markers = [
    "benchmark: performance benchmark tests",
    "smoke: critical-path smoke tests that must pass before any delivery",
    "integration: integration tests that need external services or long setup",
]

[tool.importlinter]
root_packages = ["houyi_studio"]

[[tool.importlinter.contracts]]
name = "Server layered architecture"
type = "layers"
containers = ["houyi_studio.server"]
layers = [
    "gateway",
    "execution",
    "tooling",
    "skill",
    "rag",
    "chat",
]
ignore_imports = [
    "houyi_studio.server.execution.* -> houyi_studio.server.gateway.events",
    "houyi_studio.server.execution.* -> houyi_studio.server.gateway.event_bus",
    "houyi_studio.server.execution.* -> houyi_studio.server.gateway.commands",
    "houyi_studio.server.execution.* -> houyi_studio.server.gateway.websocket",
    "houyi_studio.server.skill.* -> houyi_studio.server.gateway.commands",
    "houyi_studio.server.skill.* -> houyi_studio.server.gateway.events",
    "houyi_studio.server.tooling.* -> houyi_studio.server.gateway.events",
]

[tool.uv]
# Use official PyPI in-repo defaults; developers can add local mirrors via env.
index-url = "https://pypi.org/simple"
