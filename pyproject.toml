[project]
name = "houyi"
version = "0.1.0"
description = "Next-generation lightweight multi-agent framework with industry-leading capabilities"
authors = [
    {name = "HouYi Team"}
]
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
keywords = ["agent", "multi-agent", "llm", "neuro-symbolic", "orchestration"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    "pydantic>=2.0.0",
    "opentelemetry-api>=1.20.0",
    "opentelemetry-sdk>=1.20.0",
    "z3-solver>=4.12.0",
    "sqlparse>=0.4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.1.0",
    "mypy>=1.5.0",
]

distributed = [
    "celery>=5.3.0",
    "redis>=5.0.0",
]

model-adapters = [
    "openai>=1.0.0",
    "anthropic>=0.7.0",
]

all = [
    "houyi[dev,distributed,model-adapters]",
]

[build-system]
requires = ["setuptools>=68.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["houyi*"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
]
ignore = [
    "E501",  # line too long (handled by formatter)
]

# Per-file ignores for test files and examples
[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = [
    "F811",  # redefinition of unused name (common in test fixtures)
    "F841",  # local variable assigned but never used (test setup)
    "B011",  # assert False usage (valid in tests)
    "B905",  # zip without explicit strict parameter
]
"examples/**/*.py" = [
    "E402",  # module level import not at top (examples show step-by-step)
]

[tool.mypy]
python_version = "3.10"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "--cov=houyi --cov-report=term-missing"
python_classes = ["Test*", "!TestCase"]
filterwarnings = [
    "ignore::pytest.PytestCollectionWarning"
]
